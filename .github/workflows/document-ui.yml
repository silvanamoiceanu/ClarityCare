name: Document UI checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install interface runtime dependencies
        run: python -m pip install 'streamlit>=1.40,<2' 'PyMuPDF>=1.24,<2' 'Pillow>=10,<13' 'python-dotenv>=1,<2'
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run document unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
